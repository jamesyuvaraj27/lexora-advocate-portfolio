<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" rx="20" fill="#0F0F0F"/>
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C8A96B"/>
      <stop offset="100%" stop-color="#E5C07B"/>
    </linearGradient>
  </defs>
  <g fill="none" stroke="url(#gold)" stroke-width="4" stroke-linecap="round">
    <!-- Scale base -->
    <line x1="50" y1="25" x2="50" y2="75"/>
    <line x1="30" y1="75" x2="70" y2="75"/>
    <!-- Scale beam -->
    <line x1="25" y1="35" x2="75" y2="35"/>
    <!-- Scale pans -->
    <path d="M 20 35 Q 22 50, 30 50 Q 38 50, 40 35" fill="url(#gold)" fill-opacity="0.2"/>
    <path d="M 60 35 Q 62 50, 70 50 Q 78 50, 80 35" fill="url(#gold)" fill-opacity="0.2"/>
    <!-- Top -->
    <circle cx="50" cy="25" r="3" fill="url(#gold)"/>
  </g>
</svg>
